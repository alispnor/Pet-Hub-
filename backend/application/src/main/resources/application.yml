spring:
  application:
    name: pet-hub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pethub}
    username: ${DATABASE_USER:pethub}
    password: ${DATABASE_PASSWORD:pethub}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc.lob.non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  cache:
    type: redis

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-please-override-in-prod-at-least-32-chars-long}
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 7
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
  encryption:
    # Chave AES-256 em base64 (32 bytes). Default dev-only — em produção,
    # injetar via APP_ENCRYPTION_KEY a partir de secret manager.
    key: ${APP_ENCRYPTION_KEY:8E+PGOrLeLUCDk1d6BkIwRl9DYE19UdPcAxV90Ob7mg=}
  uploads:
    # Em dev grava em ./var/uploads (gitignored). Em prod usar volume/persistência.
    dir: ${APP_UPLOADS_DIR:var/uploads}
    public-base-url: ${APP_UPLOADS_PUBLIC_BASE_URL:http://localhost:8080/files}
    max-bytes: ${APP_UPLOADS_MAX_BYTES:5242880}
  viacep:
    base-url: ${VIACEP_BASE_URL:https://viacep.com.br}

logging:
  level:
    root: INFO
    com.alispnor.pethub: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
