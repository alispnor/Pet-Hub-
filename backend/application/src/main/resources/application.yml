spring:
  application:
    name: pet-hub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pethub}
    username: ${DATABASE_USER:pethub}
    password: ${DATABASE_PASSWORD:pethub}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc.lob.non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-please-override-in-prod-at-least-32-chars-long}
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 7
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

logging:
  level:
    root: INFO
    com.alispnor.pethub: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
