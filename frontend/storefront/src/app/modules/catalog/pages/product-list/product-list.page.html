<section class="mx-auto max-w-page px-6 py-12">
  <header class="mb-8">
    <h1 class="text-3xl text-graphite-900">
      {{ nomeCategoriaSelecionada() || 'Todos os produtos' }}
    </h1>
    <p class="mt-2 text-graphite-600">
      {{ paginaAtual()?.totalElements ?? 0 }} produto(s) disponíveis
    </p>
  </header>

  <div class="grid grid-cols-1 gap-8 lg:grid-cols-[260px_1fr]">
    <!-- Filtros -->
    <aside class="space-y-6">
      <div class="surface">
        <h2 class="text-base font-semibold text-graphite-900">Buscar</h2>
        <input type="text" class="input mt-3"
               placeholder="nome, marca…"
               [formControl]="campoBusca"
               aria-label="Buscar produtos" />
      </div>
      <div class="surface">
        <h2 class="text-base font-semibold text-graphite-900">Categorias</h2>
        <ul class="mt-3 space-y-1">
          <li>
            <button type="button"
                    class="block w-full text-left text-sm py-1.5 rounded px-2 transition-colors"
                    [class.bg-coral-50]="!categoriaSlug()"
                    [class.text-coral-700]="!categoriaSlug()"
                    [class.text-graphite-700]="!!categoriaSlug()"
                    (click)="selecionarCategoria(null)">
              Todas
            </button>
          </li>
          <li *ngFor="let categoria of categorias()">
            <button type="button"
                    class="block w-full text-left text-sm py-1.5 rounded px-2 transition-colors"
                    [class.bg-coral-50]="categoriaSlug() === categoria.slug"
                    [class.text-coral-700]="categoriaSlug() === categoria.slug"
                    [class.text-graphite-700]="categoriaSlug() !== categoria.slug"
                    (click)="selecionarCategoria(categoria.slug)">
              {{ categoria.nome }}
            </button>
          </li>
        </ul>
      </div>
    </aside>

    <!-- Resultado -->
    <div>
      <div *ngIf="loading()" class="grid grid-cols-2 gap-4 md:grid-cols-3">
        <div *ngFor="let skeletonSlot of skeletons"
             class="aspect-square animate-pulse rounded-lg bg-graphite-100"></div>
      </div>

      <div *ngIf="!loading() && produtos().length"
           class="grid grid-cols-2 gap-4 md:grid-cols-3">
        <app-product-card *ngFor="let produto of produtos()" [produto]="produto" />
      </div>

      <p *ngIf="!loading() && !produtos().length"
         class="mt-8 text-graphite-500">
        Nenhum produto encontrado{{ termoBusca() ? ' para "' + termoBusca() + '"' : '' }}.
      </p>

      <!-- Paginação -->
      <nav *ngIf="paginaAtual() && paginaAtual()!.totalPages > 1"
           class="mt-10 flex items-center justify-center gap-2"
           aria-label="Paginação">
        <button class="btn-secondary text-sm py-2 px-3"
                [disabled]="paginaAtual()!.first"
                (click)="irParaPagina(paginaAtual()!.page - 1)">Anterior</button>
        <span class="text-sm text-graphite-600 px-3">
          Página {{ paginaAtual()!.page + 1 }} de {{ paginaAtual()!.totalPages }}
        </span>
        <button class="btn-secondary text-sm py-2 px-3"
                [disabled]="paginaAtual()!.last"
                (click)="irParaPagina(paginaAtual()!.page + 1)">Próxima</button>
      </nav>
    </div>
  </div>
</section>
