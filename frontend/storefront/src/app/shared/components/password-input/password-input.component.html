<div class="relative">
  <input [id]="inputId()"
         [type]="senhaVisivel() ? 'text' : 'password'"
         class="input pr-11"
         [class.is-invalid]="invalido()"
         [value]="valorAtual()"
         [attr.autocomplete]="autocomplete()"
         [attr.placeholder]="placeholder()"
         [disabled]="desabilitado()"
         (input)="onInputChange($event)"
         (blur)="onTouchedHandler()" />
  <button type="button"
          class="absolute inset-y-0 right-0 flex items-center justify-center px-3
                 text-graphite-500 hover:text-graphite-900
                 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-coral-300 rounded-r"
          [attr.aria-label]="senhaVisivel() ? 'Ocultar senha' : 'Mostrar senha'"
          [attr.aria-pressed]="senhaVisivel()"
          [disabled]="desabilitado()"
          (click)="alternarVisibilidade()">
    <!-- ícone "olho" usando SVG inline (não depende de lib externa) -->
    <svg *ngIf="!senhaVisivel()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
         stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
      <circle cx="12" cy="12" r="3" />
    </svg>
    <!-- olho riscado quando senha está visível -->
    <svg *ngIf="senhaVisivel()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
         stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
      <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6.5 0-10-7-10-7a18.66 18.66 0 0 1 4.06-5.06" />
      <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c6.5 0 10 7 10 7a18.45 18.45 0 0 1-2.16 3.19" />
      <path d="M1 1l22 22" />
      <path d="M9.88 9.88a3 3 0 0 0 4.24 4.24" />
    </svg>
  </button>
</div>
