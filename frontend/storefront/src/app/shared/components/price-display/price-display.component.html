<div class="space-y-0.5">
  <p class="text-2xl text-graphite-900 font-semibold tracking-tight">
    {{ valor() | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
  </p>
  <p *ngIf="parcelamentoSugerido() && parcelamentoSugerido()!.quantidadeParcelas > 1"
     class="text-sm text-graphite-500">
    em {{ parcelamentoSugerido()!.quantidadeParcelas }}x de
    {{ parcelamentoSugerido()!.valorParcela | currency:'BRL':'symbol':'1.2-2':'pt-BR' }} sem juros
  </p>
</div>
