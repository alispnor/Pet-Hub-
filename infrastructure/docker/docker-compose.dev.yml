# Pet Hub — ambiente local de desenvolvimento
#
# Sobe os serviços de infraestrutura (Postgres, Redis, pgAdmin). O backend
# roda separadamente via `mvn spring-boot:run` no módulo `backend/application/`.
#
# Uso recomendado (a partir da raiz do repo):
#   docker compose --env-file .env.local -f infrastructure/docker/docker-compose.dev.yml up -d
#
# Copie `.env.local.example` para `.env.local` antes de subir.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pethub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pethub}
      POSTGRES_USER: ${POSTGRES_USER:-pethub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pethub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pethub} -d ${POSTGRES_DB:-pethub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pethub-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pethub-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pethub.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  pgadmin-data:
