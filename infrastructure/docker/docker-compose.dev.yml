# Pet Hub — ambiente local de desenvolvimento (Fase 1)
#
# Sobe apenas serviços de infraestrutura (Postgres, Redis, pgAdmin).
# O backend roda na JVM diretamente via `mvn spring-boot:run` no módulo
# `backend/application/`. A partir da Fase 8 o backend também
# containeriza (docker-compose.yml na raiz).

services:
  postgres:
    image: postgres:16-alpine
    container_name: pethub-postgres
    environment:
      POSTGRES_DB: pethub
      POSTGRES_USER: pethub
      POSTGRES_PASSWORD: pethub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pethub -d pethub"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pethub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pethub-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pethub.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  pgadmin-data:
